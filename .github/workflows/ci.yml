name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm build

      - run: pnpm test

  integration:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Supabase has historically run on older major versions; this
        # range covers everything from the oldest still-common Supabase
        # deployment up through current PostgreSQL.
        postgres: [13, 14, 15, 16, 17]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: pgaccess
          POSTGRES_PASSWORD: pgaccess
          POSTGRES_DB: pg_access_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U pgaccess -d pg_access_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Integration tests
        run: pnpm test:integration
        env:
          PG_ACCESS_TEST_DATABASE_URL: postgres://pgaccess:pgaccess@localhost:54329/pg_access_test
