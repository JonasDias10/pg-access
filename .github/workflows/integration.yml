name: Integration

# Runs only when something that can affect whether the compiled SQL still
# behaves correctly against a real PostgreSQL server changed - doc-only or
# examples-only PRs don't need the full 5-version Postgres matrix, `checks`
# in ci.yml already covers those.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "docker-compose.test.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "packages/**"
      - "docker-compose.test.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Supabase has historically run on older major versions; this
        # range covers everything from the oldest still-common Supabase
        # deployment up through current PostgreSQL.
        postgres: [13, 14, 15, 16, 17]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: pgaccess
          POSTGRES_PASSWORD: pgaccess
          POSTGRES_DB: pg_access_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U pgaccess -d pg_access_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Integration tests
        run: pnpm test:integration
        env:
          PG_ACCESS_TEST_DATABASE_URL: postgres://pgaccess:pgaccess@localhost:54329/pg_access_test
