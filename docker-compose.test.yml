services:
  postgres:
    image: postgres:17-alpine
    environment:
      # PostgreSQL disallows role names starting with "pg_" (reserved for
      # system roles), so the bootstrap user can't be "pg_access".
      POSTGRES_USER: pgaccess
      POSTGRES_PASSWORD: pgaccess
      POSTGRES_DB: pg_access_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgaccess -d pg_access_test"]
      interval: 1s
      timeout: 3s
      retries: 30
